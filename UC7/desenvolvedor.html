<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desenvolvedor</title>
    <link rel="stylesheet" href="css/desenvolvedor.css">
</head>

<body>

    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0L19.2 12l-4.6-4.6L16 6l6 6-6 6-1.4-1.4z" />
                    </svg>
                </div>
                <span class="logo-text">DevFinder</span>
            </div>
            <a href="index.html" class="link-logout">
                <svg viewBox="0 0 24 24">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Sair
            </a>
        </div>
    </header>

    <section class="hero">
        <h1>Dashboard</h1>
        <p>Veja seus protótipos</p>
    </section>

    <div class="container">
        <div class="welcome-card">
            <div class="welcome-left">
                <div class="welcome-greeting">
                    <p class="greeting-line">Seja Bem-Vindo</p>
                    <p class="name-line">João Silva</p>
                </div>

                <p class="stat-line"><span class="stat-label">Seu plano:</span> <span
                        class="highlight-purple">Trimestal</span></p>
                <p class="stat-line"><span class="stat-label">Você teve:</span> <span class="highlight-blue">300k</span>
                    <span class="stat-label">vizualições esse mês</span></p>
                <p class="stat-line"><span class="stat-label">Você teve:</span> <span class="highlight-rose">275k</span>
                    <span class="stat-label">Gostei</span></p>
            </div>

            <div class="welcome-right">
                <p class="welcome-right-title">Seu protótipo com mais gostei</p>
                <div class="top-proto">
                    <div class="thumb blue">
                        <div class="thumb-top"></div>
                        <div class="thumb-bottom"></div>
                    </div>
                    <span>App de Delivery</span>
                </div>
            </div>
        </div>

        <div class="proto-list">

            <div class="proto-row">
                <div class="proto-info">
                    <div class="thumb blue">
                        <div class="thumb-top"></div>
                        <div class="thumb-bottom"></div>
                    </div>
                    <div class="proto-text">
                        <h3>App de Delivery</h3>
                        <div class="proto-stats">
                            <span class="stat-views"><svg viewBox="0 0 24 24">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>150k</span>
                            <span class="stat-likes"><svg viewBox="0 0 24 24">
                                    <path
                                        d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" />
                                </svg>175k</span>
                        </div>
                    </div>
                </div>
                <button class="edit-btn">EDITAR</button>
            </div>

            <div class="proto-row">
                <div class="proto-info">
                    <div class="thumb pink">
                        <div class="thumb-top"></div>
                        <div class="thumb-bottom"></div>
                    </div>
                    <div class="proto-text">
                        <h3>App de Roupas</h3>
                        <div class="proto-stats">
                            <span class="stat-views"><svg viewBox="0 0 24 24">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>20k</span>
                            <span class="stat-likes"><svg viewBox="0 0 24 24">
                                    <path
                                        d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" />
                                </svg>15k</span>
                        </div>
                    </div>
                </div>
                <button class="edit-btn">EDITAR</button>
            </div>

            <div class="proto-row">
                <div class="proto-info">
                    <div class="thumb gray">
                        <div class="thumb-top"></div>
                        <div class="thumb-bottom"></div>
                    </div>
                    <div class="proto-text">
                        <h3>App de Vendas</h3>
                        <div class="proto-stats">
                            <span class="stat-views"><svg viewBox="0 0 24 24">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>50k</span>
                            <span class="stat-likes"><svg viewBox="0 0 24 24">
                                    <path
                                        d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" />
                                </svg>35k</span>
                        </div>
                    </div>
                </div>
                <button class="edit-btn">EDITAR</button>
            </div>

        </div>

        <div class="load-more-wrap">
            <button class="btn-outline">Carregar Mais Protótipos</button>
        </div>
    </div>

</body>

</html>
